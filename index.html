<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MrGameFixer - Game Fixes</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #cce7ff;
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 40px;
      text-align: center;
    }

    header {
      margin-bottom: 40px;
    }

    header img {
      width: 100px;
      vertical-align: middle;
      margin-right: 10px;
    }

    h1 {
      display: inline-block;
      font-size: 36px;
      color: #00aaff;
      margin: 0;
      vertical-align: middle;
    }

    table {
      margin: auto;
      border-collapse: collapse;
      width: 80%;
      background-color: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    th {
      background-color: #111;
      color: #00aaff;
      padding: 14px;
      font-size: 18px;
      text-transform: uppercase;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #333;
      font-size: 16px;
    }

    tr:hover {
      background-color: #222;
    }

    a {
      color: #00aaff;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }

    img {
      width: 80px;
      border-radius: 6px;
      vertical-align: middle;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <header>
    <img src="assets/logo.png" alt="MrGameFixer Logo">
    <h1>LIST OF MY GAME FIXES</h1>
  </header>

  <table>
    <tr>
      <th>Game</th>
      <th>Fix</th>
      <th>Premium</th>
    </tr>
    <tr>
      <td><img src="assets/STAR WARS Racer.ico" alt="STAR WARS Racer"> STAR WARS Episode I: Racer</td>
      <td><a href="#">DOWNLOAD</a></td>
      <td>—</td>
    </tr>
    <tr>
      <td><img src="assets/LEGO Racers.ico" alt="LEGO Racers"> LEGO Racers</td>
      <td><a href="#">DOWNLOAD</a></td>
      <td>—</td>
    </tr>
  </table>
</body>
</html>
